#1つのサービスに対して1種類のコンテナの定義を記載する
services:
  db:
    image: postgres:18-alpine
    #build:Dockerファイルがおいてあるディレクトリ（Dockerファイルを使用する場合）
    ports:
      - "5432:5432"
    #DB接続用の環境変数
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    #ホスト側にマウントする
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
    #コンテナが施錠に動作しているかの確認
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sampledb"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  booking-api:
    build: ./booking-api
    ports:
      - "5002:5002"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/sampledb
      PORT: 5002
    depends_on:
      db:
        condition: service_healthy

  travel-api:
    build: ./travel-api
    environment:
      BOOKING_API_URL: ${BOOKING_API_URL:-http://booking-api:5002}
      PORT: 5001
    depends_on:
      - booking-api

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - travel-api

