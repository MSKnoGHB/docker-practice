#1つのサービスに対して1種類のコンテナの定義を記載する
services:
  db:
    image: postgres:18-alpine
    #build:Dockerファイルがおいてあるディレクトリ（Dockerファイルを使用する場合）
    ports:
      - "5432:5432"
    #DB接続用の環境変数
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    #ホスト側にマウントする
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
    #コンテナが施錠に動作しているかの確認
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sampledb"]
      interval: 5s
      timeout: 5s
      retries: 5